plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Upload key for Google Play. Never commit this file; see README "Release builds".
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace 'com.edens.cellcity'
    compileSdk 36

    defaultConfig {
        applicationId "com.edens.cellcity"
        minSdk 24
        targetSdk 36
        versionCode 5
        versionName "1.1.0"
    }

    signingConfigs {
        release {
            if (keystorePropsFile.exists()) {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            // first upload stays unminified: the game uses no reflection, but R8
            // would need a full on-device pass before shipping
            minifyEnabled false
            if (keystorePropsFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.2.21'
    testImplementation 'junit:junit:4.13.2'
}
